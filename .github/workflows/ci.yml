name: CI

on:
  pull_request:
  push:
    branches: [main, feat/0.2.3-quality-gate]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nemocalendar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/nemocalendar_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-secret
      GOOGLE_REDIRECT_URI: postmessage
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test