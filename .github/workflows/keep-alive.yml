name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          curl -fsS --max-time 90 \
            "${{ vars.API_HEALTH_URL || 'https://nemocalendar-api.onrender.com/health' }}"